spring.application.name=dineease

# PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Server
server.port=8080

# Security diagnostics (development only)
logging.level.org.springframework.security=DEBUG

# Customer phone OTP settings
dineease.otp.expiry-minutes=5
dineease.otp.max-attempts=5

# OTP development mode: only for local development
dineease.otp.dev-mode=true


# Configure these environment variables in the deployment environment
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local,dev}
